services:
  postgres:
    image: postgres:16-alpine
    container_name: carocar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carocar
      POSTGRES_PASSWORD: carocar_local
      POSTGRES_DB: carocar
    ports:
      - "5432:5432"
    volumes:
      - carocar_pgdata:/var/lib/postgresql/data

volumes:
  carocar_pgdata:
